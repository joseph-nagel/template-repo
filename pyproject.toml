[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = []

[project]
name = "template-repo"
version = "0.0.1"
description = "Simple template for ML experiments"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Joseph Nagel", email = "JosephBNagel@gmail.com"}
]
keywords = ["template", "machine learning", "deep learning"]
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "lightning",
    "tensorboard",
    "matplotlib",
    "notebook",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pre-commit"]

[project.urls]
source = "https://github.com/joseph-nagel/template-repo"

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
extend-ignore = ["I001"]  # ignore import order

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # ignore unused imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false  # do not collapse multi-line collections with a trailing comma into a single line
